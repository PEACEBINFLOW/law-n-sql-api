[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "law-n-sql-api"
version = "0.1.0"
description = "HTTP API for running N-SQL queries over Law-N network.routes tables."
authors = [
    { name = "Peace Thabiwa", email = "you@example.com" }
]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    # Optional, but expected during real use:
    # "law-n-sql-core>=0.1.0",
]

[project.optional-dependencies]
nsql = [
    "law-n-sql-core>=0.1.0",
]

[project.scripts]
law-n-sql-api = "law_n_sql_api.main:run"
